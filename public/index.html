<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Web App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    input, button { padding: 8px; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>My First Node Web App</h1>
  <p>This page is served by plain Node.js (no dependencies).</p>

  <input id="name" placeholder="Your name" />
  <button onclick="sayHello()">Say Hello</button>
  <p id="result"></p>

  <script>
    async function sayHello() {
      const name = document.getElementById('name').value || 'World';
      const res = await fetch(`/api/hello?name=${encodeURIComponent(name)}`);
      const data = await res.json();
      document.getElementById('result').textContent = data.message;
    }
  </script>
</body>
</html>
